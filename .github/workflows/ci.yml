name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ha_catalogue_test
          POSTGRES_USER: ha
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ha -d ha_catalogue_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ha:ci-only-password@127.0.0.1:5432/ha_catalogue_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v

  demo:
    # Runs the project exactly as a visitor would: docker compose up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start database and API
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Check the API answers
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS "http://127.0.0.1:8000/items?q=posters&limit=1" \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['total'] > 0"

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
