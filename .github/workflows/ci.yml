name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ha_catalogue_test
          POSTGRES_USER: ha
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ha -d ha_catalogue_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ha:ci-only-password@127.0.0.1:5432/ha_catalogue_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v
